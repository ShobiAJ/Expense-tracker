<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Expense Tracker</h1>
            <div class="user-selector" id="user-tabs">
                <button id="p1-btn" class="active" onclick="setUser('p1')">Loading...</button>
                <button id="p2-btn" onclick="setUser('p2')">Loading...</button>
            </div>
        </header>

        <section class="stats">
            <div class="stat-card">
                <h3 id="p1-label">Person 1</h3>
                <p id="total-p1">$0.00</p>
            </div>
            <div class="stat-card">
                <h3 id="p2-label">Person 2</h3>
                <p id="total-p2">$0.00</p>
            </div>
        </section>

        <section class="input-section">
            <div class="upload-box">
                <label for="bill-upload" class="custom-file-upload">
                    <span>📷 Scan Receipt</span>
                </label>
                <input type="file" id="bill-upload" accept="image/*">
                <p id="ocr-status"></p>
            </div>

            <form id="expense-form">
                <input type="text" id="exp-name" placeholder="Expense Name (e.g. Grocery)" required>
                <div class="row">
                    <input type="number" id="exp-amount" step="0.01" placeholder="Amount" required style="width: 60%;">
                    <select id="exp-category" style="width: 35%;">
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Bills">Bills</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <input type="date" id="exp-date" required>
                <textarea id="exp-notes" placeholder="Notes (Optional)"></textarea>
                <button type="submit" id="save-btn">Record Expense</button>
            </form>
        </section>

        <section class="history">
            <h2>Recent History</h2>
            <div id="expense-list"></div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
